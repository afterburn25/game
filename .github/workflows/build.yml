name: build

on:
  push:
    branches: [ main, "dev/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Game.csproj

      - name: Build
        run: dotnet build Game.csproj --configuration Release --no-restore

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-ci
          chmod +x .godot-ci/Godot_v4.7.2-stable_mono_linux.x86_64

      - name: Godot headless editor smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s .godot-ci/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path . --editor --quit-after 5

      - name: Godot headless runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s .godot-ci/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path . --quit-after 10
