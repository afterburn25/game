name: build

on:
  push:
    branches: [ main, integration, "dev/**", "work/**", "docs/**" ]
  pull_request:
    branches: [ main, integration ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate adaptive research catalog
        run: python3 scripts/validate_research_catalog.py data/research/v1

      - name: Validate research maturation and capabilities
        run: python3 scripts/validate_research_maturation.py data/research/v1

      - name: Validate research competence and expertise
        run: python3 scripts/validate_research_competence.py data/research/v1

      - name: Restore
        run: dotnet restore Game.csproj

      - name: Build
        run: dotnet build Game.csproj --configuration Release --no-restore

      - name: Restore species mechanics checks
        run: dotnet restore tests/SpeciesMechanicsChecks/SpeciesMechanicsChecks.csproj

      - name: Run species mechanics checks
        run: dotnet run --project tests/SpeciesMechanicsChecks/SpeciesMechanicsChecks.csproj --configuration Release --no-restore

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-ci
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Godot headless editor smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT_BIN" --headless --path . --editor --quit-after 5

      - name: Godot headless runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$GODOT_BIN" --headless --path . --quit-after 10
