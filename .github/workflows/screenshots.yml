name: Game Screenshot Capture

on:
  workflow_dispatch:
  push:
    branches:
      - integration
      - work/screenshot-capture
      - work/visual-style-assets
      - work/core-game-integration

permissions:
  contents: read

concurrency:
  group: game-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build game
        run: |
          set -euo pipefail
          dotnet restore Game.csproj
          dotnet build Game.csproj --configuration Release --no-restore
          # Godot's ordinary project runner loads the Debug C# assembly. Build it explicitly
          # so scene scripts can actually instantiate during visual capture.
          dotnet build Game.csproj --configuration Debug --no-restore

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-ci
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Capture real game screenshots
        shell: bash
        env:
          STELLAR_SCREENSHOT_DIR: ${{ github.workspace }}/screenshot-artifacts
          STELLAR_CAPTURE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$STELLAR_SCREENSHOT_DIR"
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT_BIN" \
            --audio-driver Dummy \
            --path . \
            --rendering-method gl_compatibility \
            tools/ScreenshotCapture.tscn \
            2>&1 | tee "$STELLAR_SCREENSHOT_DIR/godot-capture.log"

      - name: Validate screenshot output
        shell: bash
        run: |
          set -euo pipefail
          test -s screenshot-artifacts/01-main-menu.png
          test -s screenshot-artifacts/02-campaign-overview.png
          test -s screenshot-artifacts/03-colony-sites.png
          test -s screenshot-artifacts/04-relations.png
          test -s screenshot-artifacts/manifest.txt
          grep -q "STELLAR_SCREENSHOT_CAPTURE_COMPLETE" screenshot-artifacts/godot-capture.log
          python3 scripts/validate_godot_smoke.py screenshot-artifacts/godot-capture.log --require-runtime-ready
          for image in screenshot-artifacts/*.png; do
            test "$(stat -c%s "$image")" -gt 4096
            file "$image"
          done

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-continuum-screenshots-${{ github.run_number }}
          path: screenshot-artifacts/
          if-no-files-found: warn
          retention-days: 30
