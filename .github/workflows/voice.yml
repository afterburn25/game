name: Offline voice validation

on:
  pull_request:
    branches: [ integration ]
  push:
    branches: [ work/voice-engine-tts ]

jobs:
  voice:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate speech engine and installed offline backend
        run: dotnet run --project tests/VoiceCoreChecks/VoiceCoreChecks.csproj --configuration Release
      - name: Preserve voice proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-proof-${{ matrix.os }}
          path: work/voice-core-proof/
          if-no-files-found: ignore
          retention-days: 7
